[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x-tweet-screenshot-mcp"
version = "0.1.0"
description = "Python stdio MCP server that searches X via OpenRouter Grok and screenshots tweet pages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "mcp>=1.2.0",
  "playwright>=1.45.0",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
x-tweet-screenshot-mcp = "x_tweet_screenshot_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/x_tweet_screenshot_mcp"]
